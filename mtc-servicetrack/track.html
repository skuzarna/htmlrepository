<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Ticket | MTC ServiceTrack</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="logo-mark">MTC</div>
        <div class="logo-text">
          <h1>ServiceTrack</h1>
          <span>Ticket Tracking</span>
        </div>
      </div>
      <nav>
        <a href="index.html">Home</a>
        <a href="submit.html">Report Issue</a>
        <a href="track.html">Track Ticket</a>
        <a href="agent.html">Agent</a>
        <a href="supervisor.html">Supervisor</a>
      </nav>
    </header>

    <main>
      <section class="glass-form">
        <h2>Track Your Ticket</h2>
        <p>Enter your ticket ID or email address to see the latest status.</p>
        <form id="tracking-form" class="form-grid">
          <div class="form-field" style="grid-column: span 2;">
            <label for="query">Ticket ID or Email</label>
            <input
              class="glass-input"
              id="query"
              name="query"
              type="text"
              placeholder="MTC-20240101-1234"
              required
            />
          </div>
          <div class="form-field" style="align-self: end;">
            <button class="glass-btn" type="submit">Search</button>
          </div>
        </form>
      </section>

      <section class="section">
        <h2 class="section-title">Ticket Results</h2>
        <div class="grid-3" id="tracking-results"></div>
      </section>
    </main>

    <footer class="footer">
      Track updates in real time with MTC ServiceTrack.
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
